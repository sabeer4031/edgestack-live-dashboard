<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EdgeStack Overall P&L</title>
<style>
:root{--bg:#F1F4F8;--surface:#fff;--ink:#13202D;--muted:#566677;--line:#D8E0E8;--accent:#1B5FA8;--good:#13764A;--bad:#B3261E;--warn:#8F5F00;
--mono:ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1620;--surface:#142130;--ink:#E5ECF3;--muted:#92A3B4;--line:#243648;--accent:#6FAEE8;--good:#4CC38A;--bad:#F0746B;--warn:#E0B04C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:980px;margin:0 auto}
h1{font-size:clamp(20px,4vw,28px);margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.v{font:500 clamp(20px,5vw,26px) var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.s{font-size:12px;color:var(--muted);margin-top:2px}
.good{color:var(--good)}.bad{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:transparent;text-align:right;font-size:11.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.l,td.l{text-align:left;font-family:var(--sans)}
tr:last-child td{border-bottom:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:min(320px,100%)}
.note{color:var(--muted);font-size:12px;max-width:80ch;margin-top:12px}
.err{color:var(--bad);margin:8px 0}
.stale{color:var(--warn)}
.nv{display:flex;gap:18px;margin:2px 0 10px;border-bottom:1px solid var(--line)}.nv a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}.nv a.on{color:var(--ink);border-bottom-color:var(--accent)}
</style>
</head>
<body>
<main>
<nav class="nv"><a href="index.html">Today, live</a><a class="on" href="overall.html">Overall P&amp;L</a></nav>
<h1>Overall paper book</h1>
<p class="sub" id="sub">Cumulative P&amp;L of every closed paper-book position since the forward tests began.</p>
<div id="gate" hidden>
  <p>Enter the passphrase for this page (asked once per device).</p>
  <form id="f" class="bar"><input id="pw" type="password" autocomplete="current-password" placeholder="passphrase" aria-label="passphrase"><button type="submit">Open</button></form>
  <div class="err" id="err"></div>
</div>
<div id="out"></div>
<div class="bar"><button id="rf" hidden>Refresh now</button><span class="s" id="age"></span></div>
<p class="note" id="note"></p>
</main>
<script>
const REPO='sabeer4031/edgestack-live-dashboard';
const URL_=`https://raw.githubusercontent.com/${REPO}/data/overall.enc.json`;
const $=s=>document.querySelector(s);
const NF=new Intl.NumberFormat('en-IN');
const rs=(x,sign)=>{if(x==null||isNaN(x))return '–';const a=Math.abs(Math.round(x));return (x<0?'−':(sign?'+':''))+'₹'+NF.format(a)};
const tone=x=>x>0?'good':x<0?'bad':'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let pass=null,timer=null,last=null;
try{pass=localStorage.getItem('edgestack_pass')}catch(e){}

async function decrypt(box,pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(box.salt),iterations:box.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(box.iv)},key,b64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function chart(S){if(!S||S.length<2)return '';const W=640,H=180,p=6,v=S.map(x=>x[2]),lo=Math.min(0,...v),hi=Math.max(0,...v),r=(hi-lo)||1,X=i=>p+i*(W-2*p)/(S.length-1),Y=y=>H-p-(y-lo)/r*(H-2*p);
  const pts=S.map((x,i)=>X(i).toFixed(1)+','+Y(x[2]).toFixed(1)).join(' ');const up=v[v.length-1]>=0;
  return `<div class="tablewrap" style="padding:10px"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative net P&L by day"><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="${up?'var(--good)':'var(--bad)'}" stroke-width="2"/></svg><div class="s">Cumulative net P&amp;L, ${esc(S[0][0])} to ${esc(S[S.length-1][0])}</div></div>`}
function paint(T){
  const rows=(T.strategies||[]).filter(x=>x.positions||x.open).map(x=>`<tr><td class="l">${esc(x.strategy)}${x.status==='stopped'?' (stopped)':''}</td><td>${x.positions}</td><td>${x.win_pct==null?'–':x.win_pct+'%'}</td><td>${x.pf==null?'–':x.pf}</td><td>${rs(x.gross,1)}</td><td>${rs(x.costs)}</td><td class="${tone(x.net)}">${rs(x.net,1)}</td><td>${x.days}</td><td class="${tone(x.best_day)}">${rs(x.best_day,1)}</td><td class="${tone(x.worst_day)}">${rs(x.worst_day,1)}</td><td>${x.open||'–'}</td></tr>`).join('');
  $('#out').innerHTML=`<div class="tiles">
  <div class="tile"><div class="k">Net P&amp;L, all closed</div><div class="v ${tone(T.net)}">${rs(T.net,1)}</div><div class="s">${T.positions} positions · ${T.days} sessions</div></div>
  <div class="tile"><div class="k">Gross before charges</div><div class="v ${tone(T.gross)}">${rs(T.gross,1)}</div><div class="s">charges ${rs(T.costs)}</div></div>
  <div class="tile"><div class="k">Open positions</div><div class="v">${T.open_total}</div><div class="s">${T.unreal?'unrealised '+rs(T.unreal,1):'not valued here'}</div></div></div>
  ${chart(T.series)}
  <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th class="l">Strategy</th><th>Positions</th><th>Win %</th><th>PF</th><th>Gross</th><th>Charges</th><th>Net</th><th>Days</th><th>Best day</th><th>Worst day</th><th>Open</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $('#sub').textContent=`through ${T.data_through} · built ${T.asof}`;
  $('#note').textContent=T.note||'';
  last=Date.now();
}
async function load(){
  $('#err').textContent='';
  let box;
  try{const r=await fetch(URL_+'?t='+Math.floor(Date.now()/30000),{cache:'no-store'});if(!r.ok)throw new Error('data not found yet ('+r.status+')');box=await r.json()}
  catch(e){$('#out').innerHTML='';$('#sub').textContent='Waiting for the first data push: '+e.message;return}
  if(!pass){$('#gate').hidden=false;return}
  try{const T=await decrypt(box,pass);$('#gate').hidden=true;$('#rf').hidden=false;paint(T);try{localStorage.setItem('edgestack_pass',pass)}catch(e){}}
  catch(e){pass=null;try{localStorage.removeItem('edgestack_pass')}catch(_){}$('#gate').hidden=false;$('#err').textContent='Wrong passphrase.'}
}
$('#f').addEventListener('submit',e=>{e.preventDefault();pass=$('#pw').value;load()});
$('#rf').addEventListener('click',load);
setInterval(()=>{if(last){const s=Math.round((Date.now()-last)/1000);$('#age').textContent='page refreshed '+s+' s ago';$('#age').className='s'+(s>180?' stale':'')}},1000);
timer=setInterval(()=>{if(pass&&!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pass)load()});
load();
</script>
</body>
</html>
